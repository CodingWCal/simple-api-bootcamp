<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Libre+Franklin:ital,wght@0,100..900;1,100..900&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&family=Tektur:wght@400..900&family=Tiny5&family=Unkempt:wght@400;700&family=Zen+Dots&family=Zilla+Slab:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>PokéCal Dex</title>
</head>
<body>
    <main class="pokedex">

        <section class="pokedex-left">
            <h2>P O K É M O N :</h2>
            <img class="pokemon-img" src="">
            <p class="pokemon-info" id="pokeID">Pokédex ID:</p>
            <p class="pokemon-info" id="pokeHeight">Height:</p>
            <p class="pokemon-info" id="pokeWeight">Weight:</p>
            <p id="pokeTypes"></p> 
        </section>
    
        <section class="pokedex-right">
            <audio controls>
                <source src="game-8-bit-on-278083.mp3" type="audio/mpeg">
              </audio>
            <h1>PokéCal Dex</h1>
            <form>
                <label for="pokeName">Enter Pokémon Name:</label>
                <input type="text" id="pokeName">
                <button id="pokeEnter" type="button">Catch Em All</button>
                <img src="pokeball.gif" id="pokeball">
            </form>
        </section>

    </main>
    <script src="js/main.js"></script> 
</body>
</html>
